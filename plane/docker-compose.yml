version: "3.9"

services:
  plane:
    image: planesystems/plane:latest
    ports:
      - "8080:3000"
    environment:
      - DATABASE_URL=postgresql://plane:plane@db:5432/plane
      - SECRET_KEY=changeme123
    depends_on:
      - db

  db:
    image: postgres:14
    environment:
      POSTGRES_USER: plane
      POSTGRES_PASSWORD: plane
      POSTGRES_DB: plane
    volumes:
      - plane-db:/var/lib/postgresql/data

volumes:
  plane-db:
